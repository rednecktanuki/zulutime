<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Zulu Time & Julian Date</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #1a1a1a;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', monospace;
            color: white;
        }

        .container {
            text-align: center;
            padding: 20px;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .label {
            color: #888888;
            font-size: clamp(14px, 2.5vw, 22px);
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .time {
            font-size: clamp(48px, 15vw, 100px);
            color: white;
            margin-bottom: 8px;
            font-weight: bold;
            line-height: 1;
        }

        .date {
            color: #888888;
            font-size: clamp(14px, 2.5vw, 22px);
            margin-bottom: 40px;
        }

        .julian-label {
            color: #888888;
            font-size: clamp(14px, 2.5vw, 22px);
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .julian-date {
            font-size: clamp(36px, 10vw, 64px);
            color: white;
            font-weight: bold;
            line-height: 1;
        }

        .status {
            color: #2ecc71;
            font-size: clamp(10px, 1.5vw, 14px);
            margin-top: 30px;
            text-align: center;
            position: relative;
            clear: both;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="label">ZULU TIME (UTC)</div>
        <div class="time" id="zuluTime">Loading...</div>
        <div class="date" id="zuluDate">Loading...</div>

        <div class="julian-label">JULIAN DATE</div>
        <div class="julian-date" id="julianDate">---</div>
        <div class="status" id="statusMessage"></div>
    </div>

    <script>
        let serverTimeOffset = 0;
        let usingServerTime = false;

        async function syncTimeWithServer() {
            try {
                const response = await fetch('https://worldtimeapi.org/api/timezone/Etc/UTC');
                if (!response.ok) throw new Error('Network error');
                const data = await response.json();
                const serverDateTime = new Date(data.utc_datetime);
                serverTimeOffset = serverDateTime.getTime() - Date.now();
                usingServerTime = true;
                document.getElementById('statusMessage').textContent = '✅ Time synchronized';
                document.getElementById('statusMessage').style.color = '#2ecc71';
                return serverDateTime;
            } catch (error) {
                serverTimeOffset = 0;
                usingServerTime = false;
                document.getElementById('statusMessage').textContent = '';
                return new Date();
            }
        }

        function getAccurateTime() {
            return usingServerTime ? new Date(Date.now() + serverTimeOffset) : new Date();
        }

        function updateDisplay() {
            const now = getAccurateTime();

            const utcHours = String(now.getUTCHours()).padStart(2, '0');
            const utcMinutes = String(now.getUTCMinutes()).padStart(2, '0');
            const utcSeconds = String(now.getUTCSeconds()).padStart(2, '0');
            document.getElementById('zuluTime').textContent = `${utcHours}:${utcMinutes}:${utcSeconds}`;

            const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
            const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
            document.getElementById('zuluDate').textContent =
                `${days[now.getUTCDay()]}, ${months[now.getUTCMonth()]} ${now.getUTCDate()}, ${now.getUTCFullYear()}`;

            const startOfYear = new Date(Date.UTC(now.getUTCFullYear(), 0, 0));
            const dayOfYear = Math.floor((now - startOfYear) / (1000 * 60 * 60 * 24));
            document.getElementById('julianDate').textContent = String(dayOfYear).padStart(3, '0');
        }

        async function initializeClock() {
            await syncTimeWithServer();
            updateDisplay();
            setInterval(updateDisplay, 1000);
        }

        initializeClock();
    </script>
</body>
</html>
