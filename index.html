<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zulu Time & Julian Date</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            color: white;
        }
        
        .container {
            text-align: center;
            padding: 40px;
        }
        
        .label {
            color: #888888;
            font-size: 18px;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }
        
        .time {
            font-size: 80px;
            color: white;
            margin-bottom: 48px;
            font-weight: bold;
        }
        
        .julian-label {
            color: #888888;
            font-size: 18px;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }
        
        .julian-date {
            font-size: 48px;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="label">ZULU TIME (UTC)</div>
        <div class="time" id="zuluTime">00:00:00</div>
        
        <div class="julian-label">JULIAN DATE</div>
        <div class="julian-date" id="julianDate">---</div>
    </div>

    <script>
        function updateTime() {
            // Get current UTC time
            const now = new Date();
            const utcHours = String(now.getUTCHours()).padStart(2, '0');
            const utcMinutes = String(now.getUTCMinutes()).padStart(2, '0');
            const utcSeconds = String(now.getUTCSeconds()).padStart(2, '0');
            
            // Update Zulu Time
            document.getElementById('zuluTime').textContent = 
                `${utcHours}:${utcMinutes}:${utcSeconds}`;
            
            // Calculate Julian Date (Day of Year)
            const startOfYear = new Date(Date.UTC(now.getUTCFullYear(), 0, 0));
            const diff = now - startOfYear;
            const dayOfYear = Math.floor(diff / (1000 * 60 * 60 * 24));
            
            // Format as 3 digits
            document.getElementById('julianDate').textContent = 
                String(dayOfYear).padStart(3, '0');
        }

        // Update every second
        updateTime();
        setInterval(updateTime, 1000);
    </script>
</body>
</html>
