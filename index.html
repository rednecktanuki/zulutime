<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zulu Time & Julian Date</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            color: white;
        }
        .container { text-align: center; padding: 40px; }
        .label { color: #888; font-size: 18px; letter-spacing: 2px; margin-bottom: 8px; }
        .time { font-size: 80px; color: white; margin-bottom: 8px; font-weight: bold; }
        .date { color: #888; font-size: 18px; margin-bottom: 48px; }
        .julian-label { color: #888; font-size: 18px; letter-spacing: 2px; margin-bottom: 8px; }
        .julian-date { font-size: 48px; color: white; font-weight: bold; }
        .status { color: #555; font-size: 14px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="label">ZULU TIME (UTC)</div>
        <div class="time" id="zuluTime">Loading...</div>
        <div class="date" id="zuluDate">Loading...</div>

        <div class="julian-label">JULIAN DATE</div>
        <div class="julian-date" id="julianDate">---</div>
        <div class="status" id="statusMessage">Synchronizing with time server...</div>
    </div>

    <script>
        let serverTimeOffset = 0;
        let usingServerTime = false;

        // Get accurate UTC time from a free API
        async function syncTimeWithServer() {
            try {
                const response = await fetch('https://worldtimeapi.org/api/timezone/Etc/UTC');
                if (!response.ok) throw new Error('Network error');
                const data = await response.json();
                const serverDateTime = new Date(data.utc_datetime);
                serverTimeOffset = serverDateTime.getTime() - Date.now();
                usingServerTime = true;
                document.getElementById('statusMessage').textContent = '✅ Time synchronized with server';
                document.getElementById('statusMessage').style.color = '#2ecc71';
                return serverDateTime;
            } catch (error) {
                document.getElementById('statusMessage').textContent = 'ℹ️ Using device UTC time (accurate to system clock)';
                document.getElementById('statusMessage').style.color = '#f1c40f';
                serverTimeOffset = 0;
                usingServerTime = false;
                return new Date();
            }
        }

        function getAccurateTime() {
            return usingServerTime ? new Date(Date.now() + serverTimeOffset) : new Date();
        }

        function updateDisplay() {
            const now = getAccurateTime();

            // --- ALWAYS use UTC methods ---
            const utcHours = String(now.getUTCHours()).padStart(2, '0');
            const utcMinutes = String(now.getUTCMinutes()).padStart(2, '0');
            const utcSeconds = String(now.getUTCSeconds()).padStart(2, '0');
            document.getElementById('zuluTime').textContent = `${utcHours}:${utcMinutes}:${utcSeconds}`;

            // Date format: "Thursday, July 16, 2026"
            const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
            const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
            document.getElementById('zuluDate').textContent =
                `${days[now.getUTCDay()]}, ${months[now.getUTCMonth()]} ${now.getUTCDate()}, ${now.getUTCFullYear()}`;

            // Julian Date (day of year) based on UTC
            const startOfYear = new Date(Date.UTC(now.getUTCFullYear(), 0, 0));
            const dayOfYear = Math.floor((now - startOfYear) / (1000 * 60 * 60 * 24));
            document.getElementById('julianDate').textContent = String(dayOfYear).padStart(3, '0');
        }

        async function initializeClock() {
            await syncTimeWithServer();
            updateDisplay();
            setInterval(updateDisplay, 1000);
        }

        initializeClock();
    </script>
</body>
</html>
