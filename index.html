<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zulu Time & Julian Date</title>
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="theme-color" content="#1a1a1a">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            color: white;
        }
        
        .container {
            text-align: center;
            padding: 40px;
        }
        
        .label {
            color: #888888;
            font-size: 18px;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }
        
        .time {
            font-size: 80px;
            color: white;
            margin-bottom: 8px;
            font-weight: bold;
        }
        
        .date {
            color: #888888;
            font-size: 18px;
            margin-bottom: 48px;
        }
        
        .julian-label {
            color: #888888;
            font-size: 18px;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }
        
        .julian-date {
            font-size: 48px;
            color: white;
            font-weight: bold;
        }
        
        .status {
            color: #555;
            font-size: 14px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="label">ZULU TIME (UTC)</div>
        <div class="time" id="zuluTime">Loading...</div>
        <div class="date" id="zuluDate">Loading...</div>
        
        <div class="julian-label">JULIAN DATE</div>
        <div class="julian-date" id="julianDate">---</div>
        <div class="status" id="statusMessage">Synchronizing with time server...</div>
    </div>

    <script>
        // ============================================================
        // 🔥 FIXED: ALWAYS uses UTC time, never local time
        // ============================================================
        
        let serverTimeOffset = 0;
        let usingServerTime = false;

        // Try to sync with time server
        async function syncTimeWithServer() {
            try {
                const response = await fetch('https://timeapi.io/api/Time/current/zone?timeZone=UTC');
                const data = await response.json();
                const serverDateTime = new Date(data.dateTime);
                serverTimeOffset = serverDateTime.getTime() - Date.now();
                usingServerTime = true;
                document.getElementById('statusMessage').textContent = '✅ Time synchronized with server';
                document.getElementById('statusMessage').style.color = '#2ecc71';
                return serverDateTime;
            } catch (error) {
                console.warn('Server sync failed, using device UTC time', error);
                document.getElementById('statusMessage').textContent = 'ℹ️ Using device UTC time (accurate to your system clock)';
                document.getElementById('statusMessage').style.color = '#f1c40f';
                serverTimeOffset = 0;
                usingServerTime = false;
                return new Date();
            }
        }

        function getAccurateTime() {
            // If server sync worked, use corrected time
            if (usingServerTime) {
                return new Date(Date.now() + serverTimeOffset);
            }
            // Otherwise, use device time but FORCE UTC
            return new Date();
        }

        function updateDisplay() {
            // Get the current time
            const now = getAccurateTime();
            
            // ============================================================
            // 🔥 CRITICAL: ALWAYS use getUTCHours() NOT getHours()
            // ============================================================
            const utcHours = String(now.getUTCHours()).padStart(2, '0');
            const utcMinutes = String(now.getUTCMinutes()).padStart(2, '0');
            const utcSeconds = String(now.getUTCSeconds()).padStart(2, '0');
            
            // Display time
            document.getElementById('zuluTime').textContent = `${utcHours}:${utcMinutes}:${utcSeconds}`;
            
            // Display date (Thursday, July 16, 2026 format)
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
            const dayName = days[now.getUTCDay()];
            const monthName = months[now.getUTCMonth()];
            const day = now.getUTCDate();
            const year = now.getUTCFullYear();
            document.getElementById('zuluDate').textContent = `${dayName}, ${monthName} ${day}, ${year}`;
            
            // ============================================================
            // 🔥 JULIAN DATE: Based on UTC date, not local date
            // ============================================================
            const startOfYear = new Date(Date.UTC(year, 0, 0));
            const diff = now - startOfYear;
            const dayOfYear = Math.floor(diff / (1000 * 60 * 60 * 24));
            document.getElementById('julianDate').textContent = String(dayOfYear).padStart(3, '0');
        }

        async function initializeClock() {
            await syncTimeWithServer();
            updateDisplay();
            setInterval(updateDisplay, 1000);
        }

        initializeClock();

        // Register service worker for offline support
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/zulutime/service-worker.js')
                    .then(registration => {
                        console.log('ServiceWorker registered successfully');
                    })
                    .catch(err => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }
    </script>
</body>
</html>
