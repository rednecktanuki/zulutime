<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zulu Time & Julian Date</title>
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="theme-color" content="#1a1a1a">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            color: white;
        }
        
        .container {
            text-align: center;
            padding: 40px;
        }
        
        .label {
            color: #888888;
            font-size: 18px;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }
        
        .time {
            font-size: 80px;
            color: white;
            margin-bottom: 48px;
            font-weight: bold;
        }
        
        .julian-label {
            color: #888888;
            font-size: 18px;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }
        
        .julian-date {
            font-size: 48px;
            color: white;
            font-weight: bold;
        }
        
        .status {
            color: #555;
            font-size: 14px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="label">ZULU TIME (UTC)</div>
        <div class="time" id="zuluTime">Loading...</div>
        
        <div class="julian-label">JULIAN DATE</div>
        <div class="julian-date" id="julianDate">---</div>
        <div class="status" id="statusMessage">Synchronizing with time server...</div>
    </div>

    <script>
        let serverTimeOffset = 0;

        // Try multiple time APIs for reliability
        async function syncTimeWithServer() {
            const apis = [
                // Option 1: Time API (most reliable)
                async () => {
                    const response = await fetch('https://timeapi.io/api/Time/current/zone?timeZone=UTC');
                    const data = await response.json();
                    return new Date(data.dateTime);
                },
                // Option 2: World Time API
                async () => {
                    const response = await fetch('https://worldtimeapi.org/api/timezone/Etc/UTC');
                    const data = await response.json();
                    return new Date(data.utc_datetime);
                }
            ];

            for (const api of apis) {
                try {
                    const serverDateTime = await api();
                    serverTimeOffset = serverDateTime.getTime() - Date.now();
                    document.getElementById('statusMessage').textContent = '✅ Time synchronized with server';
                    document.getElementById('statusMessage').style.color = '#2ecc71';
                    return serverDateTime;
                } catch (error) {
                    console.warn('API failed, trying next...', error);
                }
            }

            // If all APIs fail, use local time
            document.getElementById('statusMessage').textContent = '⚠️ Using local system time. Time is accurate to your device.';
            document.getElementById('statusMessage').style.color = '#f1c40f';
            serverTimeOffset = 0;
            return new Date();
        }

        function getAccurateTime() {
            return new Date(Date.now() + serverTimeOffset);
        }

        function updateDisplay() {
            // Get the current accurate time (UTC-based)
            const now = getAccurateTime();
            
            // --- ZULU TIME (UTC) - ALWAYS use getUTCHours() ---
            const utcHours = String(now.getUTCHours()).padStart(2, '0');
            const utcMinutes = String(now.getUTCMinutes()).padStart(2, '0');
            const utcSeconds = String(now.getUTCSeconds()).padStart(2, '0');
            document.getElementById('zuluTime').textContent = `${utcHours}:${utcMinutes}:${utcSeconds}`;

            // --- JULIAN DATE (Day of Year) - based on UTC date ---
            // This ensures the Julian date changes at UTC midnight, not local midnight
            const startOfYear = new Date(Date.UTC(now.getUTCFullYear(), 0, 0));
            const diff = now - startOfYear;
            const dayOfYear = Math.floor(diff / (1000 * 60 * 60 * 24));
            document.getElementById('julianDate').textContent = String(dayOfYear).padStart(3, '0');
        }

        async function initializeClock() {
            await syncTimeWithServer();
            updateDisplay();
            setInterval(updateDisplay, 1000);
        }

        initializeClock();

        // Register service worker for offline support
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/zulutime/service-worker.js')
                    .then(registration => {
                        console.log('ServiceWorker registered successfully');
                    })
                    .catch(err => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }
    </script>
</body>
</html>
